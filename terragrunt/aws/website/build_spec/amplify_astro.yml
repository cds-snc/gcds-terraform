# Amplify Gen 2 build spec for the Astro documentation site.
#
# The `applications` array (with `appRoot`) is the Gen 2 monorepo format: it tells
# Amplify the app lives in a subfolder of the gcds-docs repo rather than at the root.
# This is what lets the Astro site coexist with the Eleventy site in one repository.
#
# `appRoot` is relative to the repo root       -> gcds-docs/docs
# `baseDirectory` is relative to `appRoot`     -> gcds-docs/docs/dist
#
# SSR UPGRADE: when moving to server-side rendering, copy this file to
# amplify_astro_ssr.yml, change `baseDirectory` to `.amplify-hosting`, and point
# var.astro_build_spec at the new file (see inputs.tf). Astro's AWS Amplify adapter
# writes the deployment bundle to .amplify-hosting rather than dist.
version: 1
applications:
  - appRoot: docs
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci --cache .npm --prefer-offline
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - .npm/**/*
          - node_modules/**/*
