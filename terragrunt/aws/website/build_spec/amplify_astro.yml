# Build spec for the Astro documentation site.
#
# The Astro project lives in docs/ inside the gcds-docs repo. This is deliberately
# NOT an Amplify monorepo spec (no `applications`/`appRoot`, no
# AMPLIFY_MONOREPO_APP_ROOT): in monorepo mode Amplify requires the repo-root
# customHttp.yml to use the monorepo format too, but that file is shared with the
# Eleventy EN/FR apps, which need the flat format. A plain spec that cd's into
# docs/ lets all three apps share the same security headers until cutover.
#
# SSR UPGRADE: when moving to server-side rendering, copy this file to
# amplify_astro_ssr.yml, change `baseDirectory` to `docs/.amplify-hosting`, and
# point var.astro_build_spec at the new file (see inputs.tf).
version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Subshell: Amplify keeps the working directory between commands and
        # phases, so a bare `cd docs` here would break the `cd docs` in build.
        - (cd docs && npm ci --cache .npm --prefer-offline)
    build:
      commands:
        - cd docs && npm run build
  artifacts:
    baseDirectory: docs/dist
    files:
      - '**/*'
  cache:
    paths:
      - docs/.npm/**/*
      - docs/node_modules/**/*
